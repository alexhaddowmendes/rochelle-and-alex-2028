<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>if (location.hash === "#rsvp") document.documentElement.classList.add("jump");</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rochelle &amp; Alex | RSVP</title>
  <meta name="description" content="RSVP for Rochelle and Alex's wedding, 12 April 2028.">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap">
  <link rel="preload" as="image" type="image/webp" media="(max-aspect-ratio: 4/5)" imagesrcset="assets/img/hero-portrait-720.webp 720w, assets/img/hero-portrait-1080.webp 1080w" imagesizes="(max-aspect-ratio: 31/50) 62vh, 100vw">
  <link rel="preload" as="image" type="image/webp" media="(min-aspect-ratio: 801/1000)" imagesrcset="assets/img/hero-desktop-960.webp 960w, assets/img/hero-desktop-1672.webp 1672w" imagesizes="(max-aspect-ratio: 16/9) 178vh, 100vw">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="site-nav" aria-label="Main">
    <a href="#rsvp">RSVP</a>
    <a href="info.html">Info</a>
  </nav>

  <header class="hero" data-nav-fade>
    <picture class="hero-art">
      <source media="(max-aspect-ratio: 4/5)" type="image/webp" srcset="assets/img/hero-portrait-720.webp 720w, assets/img/hero-portrait-1080.webp 1080w" sizes="(max-aspect-ratio: 31/50) 62vh, 100vw" width="1080" height="1741">
      <img src="assets/img/hero-desktop-1672.webp" srcset="assets/img/hero-desktop-960.webp 960w, assets/img/hero-desktop-1672.webp 1672w" sizes="(max-aspect-ratio: 16/9) 178vh, 100vw" width="1672" height="941" alt="" fetchpriority="high">
    </picture>
    <p class="hero-kicker">The marriage of</p>
    <h1><span>Rochelle</span> <span>&amp; Alex</span></h1>
    <p class="hero-date">12th <span class="hero-of">of</span> April, 2028</p>
    <figure class="print">
      <img src="assets/img/ro-al-01.webp" width="991" height="790" alt="Rochelle and Alex sitting together at a garden table, Rochelle holding a white bouquet">
      <div class="postmark" aria-hidden="true">12 APR<br>2028</div>
    </figure>
    <p class="hero-venue">Sundowners, Zambales, Philippines</p>
    <a class="scroll-cue" href="#rsvp" aria-label="Scroll to RSVP">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
    </a>
  </header>

  <section class="section" id="rsvp" aria-labelledby="rsvp-heading">
    <div class="section-head">
      <h2 class="section-title" id="rsvp-heading">RSVP</h2>
      <p class="section-sub" id="rsvp-sub">Enter your full name and we'll find your household.</p>
    </div>

    <main class="page">
      <div class="card">
        <form id="find-form" novalidate>
          <label for="guest-name">Your full name</label>
          <input id="guest-name" name="name" type="text" autocomplete="name" required>
          <button type="submit">Find my invitation</button>
        </form>

        <form id="household-form" hidden>
          <div id="members"></div>

          <label for="note">Anything else we should know? <span class="optional">(optional)</span></label>
          <textarea id="note" rows="3"></textarea>

          <label for="email">Contact email</label>
          <input id="email" type="email" autocomplete="email" required>

          <button type="submit">Send our RSVP</button>
          <button type="button" class="link-button" id="start-over">Not you? Start over</button>
        </form>

        <div id="confirmation" hidden>
          <ul id="confirmation-list"></ul>
          <p>Plans changed? Come back any time and type your name again. Your latest answer is the one that counts.</p>
          <button type="button" id="change-answers">Change my answers</button>
        </div>

        <p id="message" class="message" role="status" aria-live="polite" hidden></p>
      </div>
    </main>
  </section>

  <template id="member-template">
    <fieldset class="member">
      <legend></legend>
      <div class="choice">
        <label><input type="radio" value="Coming" required> <span>Coming</span></label>
        <label><input type="radio" value="Can't make it" required> <span>Can't make it</span></label>
      </div>
      <label class="dietary-label">Dietary requirements <span class="optional">(optional)</span></label>
      <input class="dietary" type="text">
    </fieldset>
  </template>

  <footer class="site-footer">See you on the beach!</footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/rsvp.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
